[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ride-agent"
version = "0.1.0"
description = "Ride Concierge AI Agent - Stage 1 MCP Geocoding Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
